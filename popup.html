<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-container">
    <header class="header">
      <h1>For Later</h1>
    </header>

    <div class="add-container">
      <input type="text" id="manual-url" placeholder="Paste URL here..." autocomplete="off">
      <button id="add-btn">Add</button>
    </div>

    <div class="button-row">
      <button id="add-all-tabs">Add All Tabs</button>
      <button id="add-current-tab">Add Current Tab</button>
    </div>
    <button id="open-all-btn" class="btn-secondary">Open All Links</button>

    <ul id="url-list">
      <!-- Links injected via JS -->
    </ul>
  </div>

  <script src="popup.js"></script>
</body>

</html>
